spring:
  boot:
    admin:
      client:
        url: http://admin-server:9090
eureka:
  client:
    service-url:
      defaultZone: http://discover-server:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port:${random.value}}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,logfile,refresh
  endpoint:
    health:
      show-details: always

logging:
  file:
    name: logs/${spring.application.name}.log
